<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Request and Response Summary — Interactive</title>
  <link rel="stylesheet" href="player.css">
  <style>
    .journey { display:grid; grid-template-columns:1fr auto 1fr; align-items:center; gap:18px;
      max-width:860px; margin:0 auto; }
    .journey .card { min-height:118px; text-align:center; display:flex; flex-direction:column;
      justify-content:center; }
    .journey h2 { margin:0 0 8px; font-size:1rem; color:var(--indigo); }
    .journey code { font-family:var(--mono); font-size:.84rem; overflow-wrap:anywhere; }
    .arrows { font-size:1.8rem; color:var(--muted); text-align:center; line-height:1.5; }
    @media (max-width:620px) { .journey { grid-template-columns:1fr; } .arrows { transform:rotate(90deg); } }
  </style>
</head>
<body>
  <main class="page">
    <a class="home-link" href="index.html">&larr; All animations</a>
    <h1>Build the Request, Read the Response</h1>
    <p id="status" class="status"></p>

    <div class="journey">
      <div id="request-card" class="card reveal">
        <h2>You build the request</h2>
        <code>GET + endpoint + ?query</code>
      </div>
      <div id="arrows" class="arrows reveal">&#8594;<br>&#8592;</div>
      <div id="response-card" class="card reveal">
        <h2>You read the response</h2>
        <code>200 + JSON body</code>
      </div>
    </div>

    <section id="narration"></section>
    <div id="controls"></div>
    <p class="kbd-hint"><kbd>&larr;</kbd> <kbd>&rarr;</kbd> step &middot; <kbd>space</kbd> play / pause</p>
  </main>

  <script src="player.js"></script>
  <script>
    function setStatus(html) { document.getElementById('status').innerHTML = html || '&nbsp;'; }
    const requestCard = document.getElementById('request-card');
    const responseCard = document.getElementById('response-card');
    const arrows = document.getElementById('arrows');
    function show(el, visible, focus) {
      el.classList.toggle('visible', visible);
      ['focus-blue','focus-green','focus-teal'].forEach(c => el.classList.remove(c));
      if (focus) el.classList.add(focus);
    }
    const steps = [
      { title:'The whole exchange', text:'A client builds a request and reads the response returned by the API.', status:'Request → API → Response', show:{} },
      { title:'Choose GET', text:'GET tells the API that the client wants to read data.', status:'Method: <span class="mono c-request">GET</span>', show:{ request:'focus-blue' } },
      { title:'Build the URL', text:'Add the complete endpoint, then ? and the query string.', status:'GET + endpoint + ?query', show:{ request:'focus-blue' } },
      { title:'Send the request', text:'The client sends the request URL to the API.', status:'<span class="c-request">Request travels to the API →</span>', show:{ request:true, arrows:true } },
      { title:'Read the response', text:'The API returns a status code and a JSON body containing data and metadata.', status:'<span class="c-response">← Response returns to the client</span>', show:{ request:true, arrows:true, response:'focus-green' } },
      { title:'One complete cycle', text:'Build: GET + endpoint + query. Read: status + JSON body.', status:'Request and response complete', show:{ request:'focus-blue', arrows:true, response:'focus-green' } }
    ];
    initPlayer({ steps, apply:function(step) {
      setStatus(step.status); const s=step.show || {};
      show(requestCard, Boolean(s.request), typeof s.request === 'string' ? s.request : null);
      show(arrows, Boolean(s.arrows), null);
      show(responseCard, Boolean(s.response), typeof s.response === 'string' ? s.response : null);
    }});
  </script>
</body>
</html>
