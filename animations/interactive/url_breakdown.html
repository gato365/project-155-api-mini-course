<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Anatomy of a GET Request URL — Interactive</title>
  <link rel="stylesheet" href="player.css">
  <style>
    .url-bar { max-width:860px; margin:0 auto 14px; padding:14px 16px; text-align:center;
      font-family:var(--mono); font-size:clamp(.72rem,1.8vw,.94rem); background:var(--panel);
      border:2px solid var(--panel-3); border-radius:10px; overflow-x:auto; white-space:nowrap; }
    .endpoint { color:var(--orange-text); }
    .separator { color:#be123c; }
    .query { color:var(--emerald-text); }
    .parts { display:grid; grid-template-columns:1fr 1fr; gap:14px; max-width:860px; margin:0 auto; }
    .parts .label { color:var(--muted); font-size:.76rem; font-weight:700; letter-spacing:.05em;
      margin-bottom:6px; text-transform:uppercase; }
    .parts .value { font-family:var(--mono); font-size:.84rem; overflow-wrap:anywhere; }
    #endpoint-card .value { color:var(--orange-text); }
    #query-card .value { color:var(--emerald-text); }
    @media (max-width:640px) { .parts { grid-template-columns:1fr; } }
  </style>
</head>
<body>
  <main class="page">
    <a class="home-link" href="index.html">&larr; All animations</a>
    <h1>Anatomy of a GET Request</h1>
    <p id="status" class="status"></p>

    <div id="url" class="url-bar reveal">
      <span class="endpoint">https://api.open-meteo.com/v1/forecast</span><span class="separator">?</span><span class="query">latitude=35.28&amp;longitude=-120.66&amp;current=temperature_2m</span>
    </div>

    <div class="parts">
      <div id="endpoint-card" class="card reveal">
        <div class="label">Endpoint</div>
        <div class="value">https://api.open-meteo.com/v1/forecast</div>
      </div>
      <div id="query-card" class="card reveal">
        <div class="label">Query string</div>
        <div class="value">?latitude=35.28&amp;longitude=-120.66&amp;current=temperature_2m</div>
      </div>
    </div>

    <section id="narration"></section>
    <div id="controls"></div>
    <p class="kbd-hint"><kbd>&larr;</kbd> <kbd>&rarr;</kbd> step &middot; <kbd>space</kbd> play / pause</p>
  </main>

  <script src="player.js"></script>
  <script>
    function setStatus(html) { document.getElementById('status').innerHTML = html || '&nbsp;'; }
    const url = document.getElementById('url');
    const endpoint = document.getElementById('endpoint-card');
    const query = document.getElementById('query-card');

    function show(el, visible, focus) {
      el.classList.toggle('visible', visible);
      ['focus-blue','focus-green','focus-teal','focus-purple','focus-orange'].forEach(c => el.classList.remove(c));
      if (focus) el.classList.add(focus);
    }

    const steps = [
      { title:'One request URL', text:'A GET request uses one URL. We will read it as an endpoint followed by a query string.', status:'How a request URL is built', show:{} },
      { title:'The endpoint', text:'The endpoint is the complete stable address: https://api.open-meteo.com/v1/forecast.', status:'Endpoint: <span class="mono c-query">https://api.open-meteo.com/v1/forecast</span>', show:{ endpoint:'focus-orange' } },
      { title:'The question mark', text:'The ? marks the end of the endpoint and the beginning of the query string.', status:'Endpoint <span class="mono">?</span> query string', show:{ endpoint:true, query:'focus-green' } },
      { title:'The query string', text:'Key=value pairs specify the location and requested data. An & joins each pair to the next.', status:'Query: location + requested variable', show:{ endpoint:true, query:'focus-green' } },
      { title:'The complete request URL', text:'Endpoint + ? + query string forms the URL the client sends to the API.', status:'Endpoint + query string', show:{ endpoint:true, query:true, url:'focus-teal' } }
    ];

    initPlayer({
      steps,
      apply:function(step) {
        setStatus(step.status);
        const s = step.show || {};
        show(url, Boolean(s.url), typeof s.url === 'string' ? s.url : null);
        show(endpoint, Boolean(s.endpoint), typeof s.endpoint === 'string' ? s.endpoint : null);
        show(query, Boolean(s.query), typeof s.query === 'string' ? s.query : null);
      }
    });
  </script>
</body>
</html>
