project:
  type: website
  render:
    - "*.qmd"
    - "*.md"
    - "sessions/**/*.qmd"
    - "shiny-weather-app/index.qmd"
    - "!README_ME_ONLY.md"
    - "!CHANGES_SUMMARY.md"
    - "!downloads/**"
  resources:
    - downloads/api_workshop_empty.zip
    - animations/interactive/**

website:
  title: "API Workshop"
  favicon: assets/api.png
  navbar:
    left:
      - text: "Home"
        href: index.qmd
      - text: "Sessions"
        menu:
          - text: "Session 0 — Getting Started"
            href: sessions/00_Getting_Started.qmd
          - text: "Session 1 — API Mechanics & Response Fundamentals"
            href: sessions/01_JSON_and_Request_Response.qmd
          - text: "Session 2 — The Anatomy of a Request"
            href: sessions/02_CRUD_HTTP_Methods_URL.qmd
          - text: "Session 3 — Weather API — First Real Requests"
            href: sessions/03_Weather_API_Setup.qmd
          - text: "Session 4 — Historical Weather, Visualization & Wrap-Up"
            href: sessions/04_Historical_Weather_Visualization.qmd
          - text: "Take-Home Exercises"
            href: sessions/take_home_exercises.qmd
    right:
      - text: "Glossary"
        href: glossary.qmd
      - text: "Shiny Capstone"
        href: shiny-weather-app/index.qmd
      - text: "Practice Labs"
        menu:
          - text: "Lab 1 — NASA Open APIs"
            href: sessions/supplemental/nasa_api.qmd
          - text: "Lab 2 — The Cat API"
            href: sessions/supplemental/cat_api.qmd
          - text: "Lab 3 — OpenWeather (Extended)"
            href: sessions/supplemental/openweather_extra.qmd
          - text: "Lab 4 — TMDB Movie Database"
            href: sessions/supplemental/tmdb_api.qmd
          - text: "Lab 5 — GitHub REST API"
            href: sessions/supplemental/github_api.qmd
      - text: "Instructor"
        menu:
          - text: "Instructor Guide"
            href: sessions/supplemental/instructor_guide.qmd
          - text: "Question Bank"
            href: sessions/supplemental/question_bank.qmd

format:
  html:
    theme: cosmo
    css: custom.css
    toc: true
    include-after-body: assets/site-tools.html
